name: Security auto-fix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply npm audit fixes
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit fix --package-lock-only 2>&1 | tee audit.log
          audit_status=${PIPESTATUS[0]}
          echo "audit_exit=$audit_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install updated lockfile
        run: npm install --no-audit --no-fund

      - name: Run extension tests
        id: test
        continue-on-error: true
        run: |
          set +e
          npm test -- --reporter dot 2>&1 | tee test.log
          test_status=${PIPESTATUS[0]}
          echo "test_exit=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Security auto-fix summary"
            echo "- Audit exit: ${{ steps.audit.outputs.audit_exit || '0' }}"
            echo "- Test exit: ${{ steps.test.outputs.test_exit || '0' }}"
            echo "- Branch: chore/security-audit-fixes"
            echo ""
            echo "### Test log"
            echo '```text'
            tail -n 50 test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create pull request
        if: ${{ steps.test.outputs.test_exit == '0' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/security-audit-fixes
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          commit-message: 'chore: apply npm security audit fixes'
          title: 'chore: apply npm security audit fixes'
          body: |
            ## Security update

            This PR was generated automatically by the security auto-fix workflow.

            - `npm audit fix --package-lock-only` was attempted
            - `npm test -- --reporter dot` was executed
            - validation details are included in the workflow summary

            ### Summary
            - Audit exit code: `${{ steps.audit.outputs.audit_exit || '0' }}`
            - Test exit code: `${{ steps.test.outputs.test_exit || '0' }}`
            - Validation result: `pass`

            Please review the dependency changes and the test result before merging.

      - name: Fail workflow when tests fail
        if: ${{ steps.test.outputs.test_exit != '0' }}
        run: |
          echo "Validation failed; no PR will be created."
          exit 1
